[package]
name = "media-identifier"
description = "Media Identifier desktop app (Tauri shell around mi-core)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
default-run = "media-identifier"

[lib]
name = "media_identifier_lib"
path = "src/lib.rs"

[[bin]]
name = "media-identifier"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
mi-types.workspace = true
mi-core.workspace = true
mi-media.workspace = true
mi-sources.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2.12.1", features = [] }
tauri-plugin-updater = "2.13.1"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"

[features]
# Vulkan GPU speech recognition on Windows. Off in releases: such a build links vulkan-1.dll and
# does not start on a PC without a Vulkan driver (docs/development.md, "Speech recognition").
vulkan = ["mi-core/vulkan"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
