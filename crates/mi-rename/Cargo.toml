[package]
name = "mi-rename"
description = "Naming templates, rename in place, copy, CSV export and the undo journal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
mi-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
csv.workspace = true
unicode-normalization = "0.1.25"

# No-replace renames through the operating system (see src/fsops.rs).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
