# Windows builds link the C and C++ runtimes statically (/MT). The per-user NSIS installer ships
# no Visual C++ redistributable, and whisper.cpp is C++: linked dynamically, the app would need
# MSVCP140.dll and VCRUNTIME140.dll and would not start on a PC without them. The cmake crate
# reads this flag and builds whisper.cpp and ggml with /MT too. The release workflow checks the
# built executable with `dumpbin /dependents`.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
