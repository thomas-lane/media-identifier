  <text x="56" y="214" font-size="14" font-weight="600" class="muted">Heard in the file (speech recognition)</text>
  <text x="56" y="246" font-size="19" class="text">“… <tspan data-mark-class="mark">lucky seven</tspan>, he's got the rhythm…</text>
  <text x="56" y="278" font-size="19" class="text"><tspan data-mark-class="mark">seven</tspan> <tspan data-mark-class="mark">fourteen</tspan> <tspan data-mark-class="mark">twenty-one</tspan>…”</text>

