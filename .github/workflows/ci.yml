# Checks every push to main and every pull request on the two supported platforms.
# What it checks: docs/development.md, "Build and test". Actions are pinned to commit SHAs (the
# tag is in the comment), so a moved tag cannot change what runs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # pinned by rust-toolchain.toml
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      - name: UI lint
        run: npm run lint
        working-directory: ui

      - name: UI tests
        run: npm test
        working-directory: ui

      - name: UI build
        run: npm run build
        working-directory: ui

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The media tests make their fixture files with a full ffmpeg and run the code against it;
      # MI_REQUIRE_FFMPEG_TESTS=1 turns a missing ffmpeg into a failure instead of a skip.
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress

      - name: Rust tests
        run: cargo test --workspace
        env:
          MI_REQUIRE_FFMPEG_TESTS: "1"

      - name: Third-party notices are current
        run: node scripts/third-party-notices.mjs --check

  workflows:
    name: Workflows and notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint workflow files
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: The ffmpeg notice matches the build script
        run: scripts/build-ffmpeg.sh --check-notice
